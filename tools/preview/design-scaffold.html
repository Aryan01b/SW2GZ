<!doctype html>
<!--
Design scaffold — NOT wired to production. Revamp target for
SW2GZ/UI/PreviewWeb/index.html: fixed-WIDTH left panel (Links shown as
a real parent/child tree + Joints, each section collapsible) +
fixed-WIDTH right panel (Details of the current selection, plus a
Settings section: COM markers, TF frame size). Dark charcoal theme
(VSCode/Claude-dark register), no HUD/data clusters, no display-mode
toggles, responsive down to narrow widths. Viewport shows meshes
(colored from a curated palette cycled by tree position — no real
per-part color data to key off), per-link TF frame (axes triad +
origin dot), orbit-drag to rotate. Served by tools/preview/serve-web.ps1
at /scaffold.html against the same /robot.urdf, /meshes/*, /vendor/*
routes the real preview uses.
-->
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SW2GZ — preview scaffold</title>
  <style>
    :root {
      --bg:        #1e1e1e;
      --panel:     #232323;
      --panel-2:   #2a2a2a;
      --panel-3:   #303030;
      --edge:      #383838;
      --fore:      #d4d4d4;
      --fore-2:    #a0a0a0;
      --muted:     #767676;
      --accent:    #5a9bd4;
      --accent-bg: #2a3742;
      --mono: "Cascadia Code", Consolas, "SF Mono", monospace;
      --t-revolute:   #5a9bd4;
      --t-continuous: #5fb8a8;
      --t-prismatic:  #b08fd6;
      --t-fixed:      #767676;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--fore);
      font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    #app {
      display: grid;
      grid-template-columns: 220px 1fr 260px;   /* fixed widths — no drag handles */
      height: 100vh;
    }

    /* ── Shared side-panel chrome (left Links/Joints, right Details/
       Settings) — sections collapse independently, panel WIDTH is
       fixed either way. ──────────────────────────────────────────── */
    .side {
      background: var(--panel); display: flex; flex-direction: column; overflow: hidden;
    }
    #panel { border-right: 1px solid var(--edge); }
    #details-panel { border-left: 1px solid var(--edge); }
    .side .brand {
      height: 44px; flex-shrink: 0;
      display: flex; align-items: center; gap: 8px; padding: 0 14px;
      border-bottom: 1px solid var(--edge);
      font-weight: 600; font-size: 13px; color: var(--fore); letter-spacing: 0.2px;
    }
    .side .brand .mark {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }
    .side .section { display: flex; flex-direction: column; flex: 1 1 0; min-height: 0; }
    .side .section.collapsed { flex: 0 0 auto; }
    .side .section + .section { border-top: 1px solid var(--edge); }
    .side .section-h {
      display: flex; align-items: center; gap: 6px;
      margin: 0; padding: 9px 14px; cursor: pointer; flex-shrink: 0;
      font-size: 10.5px; letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--muted); font-weight: 600; user-select: none;
    }
    .side .section-h:hover { color: var(--fore-2); }
    .side .section-h .chev { transition: transform 0.12s ease; font-size: 9px; width: 10px; }
    .side .section.collapsed .section-h .chev { transform: rotate(-90deg); }
    .side .section-h .count { margin-left: auto; color: var(--muted); font-weight: 400; }
    .side .section-body { overflow-y: auto; min-height: 0; }
    .side .section.collapsed .section-body { display: none; }
    .side .section-body::-webkit-scrollbar { width: 8px; }
    .side .section-body::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 4px; }
    .side .section-body::-webkit-scrollbar-track { background: transparent; }

    .row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; cursor: pointer; border-left: 2px solid transparent;
    }
    .row:hover { background: var(--panel-2); }
    .row.active { background: var(--accent-bg); border-left-color: var(--accent); color: var(--accent); }
    .row .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--muted); }
    .row.active .dot { background: var(--accent); }
    .row .name { flex: 1; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .badge {
      font-size: 9px; padding: 2px 6px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600;
      background: var(--panel-3); color: var(--fore-2);
    }
    .row .badge.revolute   { color: var(--t-revolute);   background: color-mix(in srgb, var(--t-revolute) 18%, var(--panel-3)); }
    .row .badge.continuous { color: var(--t-continuous); background: color-mix(in srgb, var(--t-continuous) 18%, var(--panel-3)); }
    .row .badge.prismatic  { color: var(--t-prismatic);  background: color-mix(in srgb, var(--t-prismatic) 18%, var(--panel-3)); }
    .row .badge.fixed       { color: var(--t-fixed); }
    .row.child { padding-left: 26px; }

    /* ── Details section: metadata + live joint control ─────────── */
    #details-empty { padding: 16px 14px; color: var(--muted); font-size: 12px; text-align: center; }
    .meta-block { padding: 10px 14px 14px; }
    .meta-title { font-size: 12.5px; font-weight: 600; color: var(--fore); margin-bottom: 8px; word-break: break-all; }
    .meta-row {
      display: flex; justify-content: space-between; gap: 10px;
      padding: 3px 0; font-size: 11.5px; color: var(--fore-2);
      border-bottom: 1px dashed var(--edge);
    }
    .meta-row:last-of-type { border-bottom: none; }
    .meta-row span:first-child { color: var(--muted); }
    .meta-row b { font-family: var(--mono); font-weight: 500; color: var(--fore); text-align: right; }

    .joint-control { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--edge); }
    .joint-control .row-label {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 10.5px; letter-spacing: 0.4px; text-transform: uppercase; color: var(--muted);
      margin-bottom: 6px;
    }
    .joint-control .readout { font-family: var(--mono); font-size: 12px; color: var(--accent); }
    .joint-control .limits { display: flex; justify-content: space-between; font-size: 10px; font-family: var(--mono); color: var(--muted); margin-top: 2px; }
    .joint-control .reset-btn {
      margin-top: 8px; width: 100%; padding: 5px 0; font-size: 11px;
      background: var(--panel-3); color: var(--fore-2); border: 1px solid var(--edge);
      border-radius: 4px; cursor: pointer;
    }
    .joint-control .reset-btn:hover { color: var(--fore); border-color: var(--muted); }
    .joint-control .no-dof { font-size: 11.5px; color: var(--muted); font-style: italic; }

    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px;
      background: var(--panel-3); outline: none; margin: 6px 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: 2px solid var(--panel);
      box-shadow: 0 0 0 1px var(--accent);
    }

    /* ── Settings section (bottom of the right panel) ────────────── */
    .setting { padding: 10px 14px; border-bottom: 1px dashed var(--edge); }
    .setting:last-child { border-bottom: none; }
    .setting .row-label {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 10.5px; letter-spacing: 0.4px; text-transform: uppercase; color: var(--muted);
    }
    .setting .readout { font-family: var(--mono); font-size: 12px; color: var(--accent); }
    .setting label.check {
      display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fore-2); cursor: pointer;
    }
    .setting input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }

    /* ── Viewport ────────────────────────────────────────────────── */
    #viewport { position: relative; }
    #viewport canvas { display: block; }
    #corner-axes { position: absolute; right: 14px; top: 14px; width: 74px; height: 74px; pointer-events: none; }
    #hint {
      position: absolute; left: 14px; bottom: 12px;
      font-size: 11px; color: var(--fore-2);
      background: rgba(35,35,35,0.75); padding: 4px 8px; border-radius: 4px;
    }

    /* ── Responsive: narrow viewports stack both panels around the
       viewport instead of beside it. ─────────────────────────────── */
    @media (max-width: 900px) {
      #app { grid-template-columns: 1fr; grid-template-rows: minmax(140px, 30vh) 1fr minmax(140px, 30vh); }
      #panel { border-right: none; border-bottom: 1px solid var(--edge); }
      #details-panel { border-left: none; border-top: 1px solid var(--edge); }
    }
    @media (max-width: 420px) {
      .side .brand { font-size: 12px; }
      #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="panel" class="side">
      <div class="brand"><span class="mark"></span>SW2GZ preview</div>
      <div class="section" data-section="links">
        <div class="section-h"><span class="chev">▾</span>Links<span class="count" id="links-count"></span></div>
        <div class="section-body"><div id="links-list"></div></div>
      </div>
      <div class="section" data-section="joints">
        <div class="section-h"><span class="chev">▾</span>Joints<span class="count" id="joints-count"></span></div>
        <div class="section-body"><div id="joints-list"></div></div>
      </div>
    </aside>
    <div id="viewport">
      <canvas id="corner-axes"></canvas>
      <div id="hint">drag to orbit · scroll to zoom</div>
    </div>
    <aside id="details-panel" class="side">
      <div class="section" data-section="details">
        <div class="section-h"><span class="chev">▾</span>Details</div>
        <div class="section-body">
          <div id="details-empty">select a link or joint</div>
          <div id="details-content" style="display:none"></div>
        </div>
      </div>
      <div class="section" data-section="settings" style="flex: 0 0 auto;">
        <div class="section-h"><span class="chev">▾</span>Settings</div>
        <div class="section-body">
          <div class="setting">
            <label class="check"><input type="checkbox" id="com-toggle"/>show center-of-mass</label>
          </div>
          <div class="setting">
            <div class="row-label"><span>tf frame size</span><span class="readout" id="frame-size-readout">0.08</span></div>
            <input type="range" id="frame-size-slider" min="0.02" max="0.3" step="0.01" value="0.08"/>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Offline-first importmap, same vendor tree as the real preview. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/",
      "three/examples/jsm/": "./vendor/three/examples/jsm/",
      "urdf-loader": "./vendor/urdf-loader/src/URDFLoader.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';
    import URDFLoader from 'urdf-loader';

    const viewport = document.getElementById('viewport');

    // ── Scene ──────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e1e);

    // Collapsible sections in both side panels (panel width stays fixed).
    document.querySelectorAll('.side .section-h').forEach(h => {
      h.addEventListener('click', () => h.parentElement.classList.toggle('collapsed'));
    });

    const camera = new THREE.PerspectiveCamera(45, 1, 0.001, 100);
    camera.up.set(0, 0, 1); // Z-up (REP-103)
    camera.position.set(1.4, -1.4, 1.1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0.2);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const key = new THREE.DirectionalLight(0xffffff, 1.0);
    key.position.set(2, -2, 3);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xbcd4ff, 0.45);
    fill.position.set(-2, 1, 1.5);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, 0.35);
    rim.position.set(0, 2, -1);
    scene.add(rim);

    const grid = new THREE.GridHelper(4, 20, 0x3d3d3d, 0x2c2c2c);
    grid.rotation.x = Math.PI / 2; // lie flat in XY (Z-up)
    scene.add(grid);

    function resize() {
      const w = viewport.clientWidth, h = viewport.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', resize);

    // ── Corner orientation gizmo (view-only, not a transform tool) ──
    const gizmoScene = new THREE.Scene();
    const gizmoCam = new THREE.OrthographicCamera(-1.2, 1.2, 1.2, -1.2, 0.1, 10);
    gizmoCam.up.set(0, 0, 1);
    gizmoScene.add(new THREE.AxesHelper(1));
    const gizmoRenderer = new THREE.WebGLRenderer({ canvas: document.getElementById('corner-axes'), alpha: true, antialias: true });
    gizmoRenderer.setSize(74, 74);

    // ── Per-link color — no real per-part color data survives to the
    // browser. A curated categorical palette (cycled by tree order, not
    // hashed by name) reads cleaner than random hues: no muddy/clashing
    // adjacent colors, and sibling links land on visually distinct entries.
    const LINK_PALETTE = [
      0x5aa9d4, 0xd4915a, 0x7fbf6e, 0xc46a95, 0x9a7ed6,
      0x5ec2b0, 0xd6a63c, 0xd66a6a, 0x6ea7bf, 0xa3b562,
    ];
    function colorForLink(index) {
      return new THREE.Color(LINK_PALETTE[index % LINK_PALETTE.length]);
    }

    // ── Link hierarchy — DFS over the parent/child map from jointMeta,
    // starting at whichever link(s) never appear as a joint's child.
    // Gives both a display order (children right after their parent)
    // and a depth (for indentation + the palette index below). ──────
    function buildLinkTree(linkNames) {
      const childrenOf = {}; linkNames.forEach(n => childrenOf[n] = []);
      const hasParent = new Set();
      for (const j of Object.values(jointMeta)) {
        if (j.parent && j.child && childrenOf[j.parent]) { childrenOf[j.parent].push(j.child); hasParent.add(j.child); }
      }
      const ordered = [];
      function dfs(name, depth) { ordered.push({ name, depth }); childrenOf[name].forEach(c => dfs(c, depth + 1)); }
      linkNames.filter(n => !hasParent.has(n)).forEach(r => dfs(r, 0));
      return ordered;
    }

    // ── Mesh loading ─────────────────────────────────────────────────
    // MeshStandardMaterial is fully unlit (renders pure black,
    // indistinguishable from --bg) on any geometry missing vertex
    // normals, so always fall back to computing them (production's
    // paintMeshes does the same, see PreviewWeb/index.html). Tagged
    // userData.bodyMesh so the per-link recolor pass (below) can find
    // real body meshes without also recoloring origin dots/COM markers.
    const collada = new ColladaLoader();
    const stl = new STLLoader();
    function shadeMesh(o) {
      o.material = new THREE.MeshStandardMaterial({ color: 0x9fb3c8, roughness: 0.55, metalness: 0.05 });
      o.userData.bodyMesh = true;
      if (o.geometry && !o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    }
    function loadMeshCb(path, manager, onComplete) {
      const ext = path.split('.').pop().toLowerCase();
      if (ext === 'dae') {
        collada.load(path, dae => {
          dae.scene.traverse(o => { if (o.isMesh) shadeMesh(o); });
          onComplete(dae.scene);
        }, undefined, () => onComplete(new THREE.Object3D()));
      } else if (ext === 'stl') {
        stl.load(path, geom => {
          const mesh = new THREE.Mesh(geom, null);
          shadeMesh(mesh);
          onComplete(mesh);
        }, undefined, () => onComplete(new THREE.Object3D()));
      } else {
        onComplete(new THREE.Object3D());
      }
    }

    // ── TF-frame + origin-dot helpers — grouped + uniformly scaled so
    // the "tf frame size" slider can resize every frame at once. ────
    const frameGroups = [];
    function addFrame(target) {
      const group = new THREE.Group();
      group.add(new THREE.AxesHelper(1));
      group.add(new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 12, 8),
        new THREE.MeshBasicMaterial({ color: 0xd0d4da })
      ));
      group.scale.setScalar(0.08);
      target.add(group);
      frameGroups.push(group);
    }

    // ── COM markers — one per link with an <inertial> origin, hidden
    // until the Settings checkbox turns them on. ────────────────────
    const comMarkers = [];
    function addComMarker(link, com) {
      const marker = new THREE.Mesh(
        new THREE.SphereGeometry(0.014, 14, 10),
        new THREE.MeshBasicMaterial({ color: 0xe0a458 })
      );
      marker.position.set(com[0], com[1], com[2]);
      marker.visible = false;
      link.add(marker);
      comMarkers.push(marker);
    }

    // ── URDF metadata (mass/inertia/origin/axis/limit) — parsed straight
    // from the XML, independent of urdf-loader's kinematic robot object,
    // same approach as production's parseUrdfMeta. ───────────────────
    const linkMeta = {};
    const jointMeta = {};
    function parseUrdfMeta(urdfText) {
      const doc = new DOMParser().parseFromString(urdfText, 'application/xml');
      const vec = s => (s || '').trim().split(/\s+/).map(Number);

      for (const link of doc.getElementsByTagName('link')) {
        const name = link.getAttribute('name'); if (!name) continue;
        const inertial = link.getElementsByTagName('inertial')[0];
        const meta = { mass: null, com: null, hasInertial: false };
        if (inertial) {
          meta.hasInertial = true;
          const mass = inertial.getElementsByTagName('mass')[0];
          if (mass) meta.mass = parseFloat(mass.getAttribute('value'));
          const origin = inertial.getElementsByTagName('origin')[0];
          if (origin) meta.com = vec(origin.getAttribute('xyz'));
        }
        linkMeta[name] = meta;
      }
      for (const joint of doc.getElementsByTagName('joint')) {
        const name = joint.getAttribute('name'); if (!name) continue;
        const parent = joint.getElementsByTagName('parent')[0];
        const child = joint.getElementsByTagName('child')[0];
        const origin = joint.getElementsByTagName('origin')[0];
        const limit = joint.getElementsByTagName('limit')[0];
        jointMeta[name] = {
          type: joint.getAttribute('type') || 'fixed',
          parent: parent?.getAttribute('link') || null,
          child: child?.getAttribute('link') || null,
          origin: {
            xyz: origin ? vec(origin.getAttribute('xyz') || '0 0 0') : [0, 0, 0],
            rpy: origin ? vec(origin.getAttribute('rpy') || '0 0 0') : [0, 0, 0],
          },
          limit: limit ? {
            lower: parseFloat(limit.getAttribute('lower') || 'NaN'),
            upper: parseFloat(limit.getAttribute('upper') || 'NaN'),
          } : null,
        };
      }
    }

    function fmt(n, d = 3) { return (typeof n === 'number' && !Number.isNaN(n)) ? n.toFixed(d) : '—'; }
    function vecStr(v) { return v ? v.map(n => fmt(n)).join(', ') : '—'; }

    function populatePanel(robot, linkTree) {
      const linksList = document.getElementById('links-list');
      const jointsList = document.getElementById('joints-list');
      const jointNames = Object.keys(robot.joints);

      linkTree.forEach(({ name, depth }, i) => {
        const row = document.createElement('div');
        row.className = 'row';
        row.style.paddingLeft = (14 + depth * 14) + 'px';
        row.innerHTML = `<span class="dot" style="background:#${colorForLink(i).getHexString()}"></span><span class="name">${name}</span>`;
        row.onclick = () => selectLink(name, row);
        linksList.appendChild(row);
      });
      for (const name of jointNames) {
        const j = robot.joints[name];
        const row = document.createElement('div');
        row.className = 'row child';
        row.innerHTML = `<span class="dot"></span><span class="name">${name}</span><span class="badge ${j.jointType}">${j.jointType}</span>`;
        row.onclick = () => selectJoint(name, row);
        jointsList.appendChild(row);
      }
      document.getElementById('links-count').textContent = linkTree.length;
      document.getElementById('joints-count').textContent = jointNames.length;
    }

    const detailsEmpty = document.getElementById('details-empty');
    const detailsContent = document.getElementById('details-content');
    function showDetails(html) {
      detailsEmpty.style.display = 'none';
      detailsContent.style.display = '';
      detailsContent.innerHTML = html;
    }
    function markActive(container, row) {
      container.querySelectorAll('.row').forEach(r => r.classList.remove('active'));
      row.classList.add('active');
    }

    function selectLink(name, row) {
      markActive(document.getElementById('links-list'), row);
      const meta = linkMeta[name] || {};
      showDetails(`
        <div class="meta-block">
          <div class="meta-title">${name}</div>
          <div class="meta-row"><span>mass</span><b>${meta.hasInertial ? fmt(meta.mass, 4) + ' kg' : '—'}</b></div>
          <div class="meta-row"><span>com (xyz)</span><b>${vecStr(meta.com)}</b></div>
          <div class="meta-row"><span>meshes</span><b>${robot.links[name]?.children?.length ?? 0}</b></div>
        </div>
      `);
    }

    function selectJoint(name, row) {
      markActive(document.getElementById('joints-list'), row);
      const meta = jointMeta[name] || {};
      const joint = robot.joints[name];
      const hasDof = meta.type === 'revolute' || meta.type === 'continuous' || meta.type === 'prismatic';
      const isAngular = meta.type !== 'prismatic';
      const lower = meta.limit && !Number.isNaN(meta.limit.lower) ? meta.limit.lower : (isAngular ? -Math.PI : -0.1);
      const upper = meta.limit && !Number.isNaN(meta.limit.upper) ? meta.limit.upper : (isAngular ? Math.PI : 0.1);
      const current = Array.isArray(joint.jointValue) ? joint.jointValue[0] : (joint.jointValue ?? 0);

      showDetails(`
        <div class="meta-block">
          <div class="meta-title">${name}</div>
          <div class="meta-row"><span>type</span><b>${meta.type}</b></div>
          <div class="meta-row"><span>parent → child</span><b>${meta.parent} → ${meta.child}</b></div>
          <div class="meta-row"><span>origin xyz</span><b>${vecStr(meta.origin.xyz)}</b></div>
          <div class="meta-row"><span>origin rpy</span><b>${vecStr(meta.origin.rpy)}</b></div>
          <div class="meta-row"><span>axis</span><b>${vecStr([joint.axis.x, joint.axis.y, joint.axis.z])}</b></div>
          ${hasDof ? `
          <div class="joint-control">
            <div class="row-label"><span>try it</span><span class="readout" id="jv-readout">${fmt(isAngular ? current * 180 / Math.PI : current, 1)}${isAngular ? '°' : ' m'}</span></div>
            <input type="range" id="jv-slider" min="${lower}" max="${upper}" step="${(upper - lower) / 200 || 0.01}" value="${current}"/>
            <div class="limits"><span>${fmt(isAngular ? lower * 180 / Math.PI : lower, 1)}</span><span>${fmt(isAngular ? upper * 180 / Math.PI : upper, 1)}</span></div>
            <button class="reset-btn" id="jv-reset">reset to 0</button>
          </div>` : `<div class="joint-control"><span class="no-dof">fixed — no motion to try</span></div>`}
        </div>
      `);

      if (hasDof) {
        const slider = document.getElementById('jv-slider');
        const readout = document.getElementById('jv-readout');
        slider.addEventListener('input', () => {
          const v = parseFloat(slider.value);
          robot.setJointValue(name, v);
          readout.textContent = fmt(isAngular ? v * 180 / Math.PI : v, 1) + (isAngular ? '°' : ' m');
        });
        document.getElementById('jv-reset').addEventListener('click', () => {
          slider.value = 0;
          slider.dispatchEvent(new Event('input'));
        });
      }
    }

    // ── Settings wiring ────────────────────────────────────────────
    document.getElementById('com-toggle').addEventListener('change', e => {
      comMarkers.forEach(m => m.visible = e.target.checked);
    });

    const frameSizeSlider = document.getElementById('frame-size-slider');
    frameSizeSlider.addEventListener('input', () => {
      const v = parseFloat(frameSizeSlider.value);
      document.getElementById('frame-size-readout').textContent = v.toFixed(2);
      frameGroups.forEach(g => g.scale.setScalar(v));
    });

    // ── Load robot.urdf ──────────────────────────────────────────────
    let robot;
    const loader = new URDFLoader();
    loader.loadMeshCb = loadMeshCb;
    loader.workingPath = '.';

    fetch('/robot.urdf').then(r => r.text()).then(urdfText => {
      parseUrdfMeta(urdfText);
      // Mesh filenames are package://<pkg>/meshes/*; map that package name
      // to '' so it resolves against our server's flat /meshes/<name> route
      // (mirrors production's `loader.packages = { [pkg]: '' }`).
      const pkgMatch = urdfText.match(/package:\/\/([^\/]+)\//);
      loader.packages = pkgMatch ? { [pkgMatch[1]]: '' } : { '': '' };
      robot = loader.parse(urdfText);
      scene.add(robot);
      const linkTree = buildLinkTree(Object.keys(robot.links));
      for (const name in robot.links) {
        addFrame(robot.links[name]);
        if (linkMeta[name]?.com) addComMarker(robot.links[name], linkMeta[name].com);
      }
      populatePanel(robot, linkTree);

      // Recolor per-link (palette index = tree position, so sibling
      // links land on visually distinct entries) + frame the camera,
      // once meshes have actually finished loading — loadMeshCb resolves
      // async, so doing either right here misses the real meshes.
      requestAnimationFrame(() => setTimeout(() => {
        linkTree.forEach(({ name }, i) => {
          const color = colorForLink(i);
          robot.links[name].traverse(o => { if (o.isMesh && o.userData.bodyMesh) o.material.color.copy(color); });
        });
        const box = new THREE.Box3().setFromObject(robot);
        const size = box.getSize(new THREE.Vector3()).length() || 1;
        const center = box.getCenter(new THREE.Vector3());
        controls.target.copy(center);
        camera.position.copy(center).add(new THREE.Vector3(size * 0.9, -size * 0.9, size * 0.7));
        camera.near = size / 100; camera.far = size * 20;
        camera.updateProjectionMatrix();
      }, 150));
    });

    resize();
    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      gizmoCam.position.copy(camera.position).sub(controls.target).setLength(3);
      gizmoCam.lookAt(0, 0, 0);
      gizmoRenderer.render(gizmoScene, gizmoCam);
    })();
  </script>
</body>
</html>
