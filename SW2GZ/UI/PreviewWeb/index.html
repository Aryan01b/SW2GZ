<!--
Copyright (c) 2026 Aryan Arlikar. MIT License — see CONTRIBUTING.md.

In-addin browser preview for SW2GZ exports. Loads /robot.urdf, fetches
DAE / STL meshes from /meshes/, parses the URDF for inertial / joint
metadata, and renders via three.js + urdf-loader.

Layout (Option D — Minimal):
  - 60 px icon rail at left with Links + Joints drawer buttons.
  - Slide-out drawer (300 px) with Links pane or Joints pane.
  - 3D viewport fills the rest; HUD overlays surface key state.
  - Bottom HUD strip holds display toggles (no separate panel).

Conventions:
  - Z-up world (REP-103). Camera up = +Z. Axes overlay X red / Y green / Z blue.
  - Mouse: left-drag orbit, wheel zoom, right-drag (or shift+drag) pan.

Hosted from the SW2GZ addin's PreviewServer (HttpListener) on 127.0.0.1.
Modules load from ./vendor/* — zero network calls at runtime.
-->
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SW2GZ — 3D preview</title>
  <style>
    :root {
      --bg:        #14171c;
      --panel:     #1a1e25;
      --panel-2:   #20252e;
      --panel-3:   #232831;
      --edge:      #2a313c;
      --edge-2:    #353d4a;
      --fore:      #d6dae1;
      --fore-2:    #a8aeb8;
      --muted:     #6c7280;
      --accent:    #5aa8e0;
      --good:      #6ed084;
      --warn:      #e6a25a;
      --bad:       #d86060;
      --x:         #e26c6c;
      --y:         #6ed084;
      --z:         #5aa8e0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--fore);
      font: 12.5px/1.5 "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    #app {
      display: grid; grid-template-columns: 60px 1fr; height: 100vh;
      position: relative;
    }

    /* ── Icon rail ────────────────────────────────────────────── */
    #rail {
      background: var(--panel); border-right: 1px solid var(--edge);
      display: flex; flex-direction: column;
    }
    #rail .logo {
      height: 50px;
      display: flex; align-items: center; justify-content: center;
      border-bottom: 1px solid var(--edge); color: var(--accent);
      font-weight: 700; font-size: 12.5px; letter-spacing: 1px;
      font-family: Consolas, monospace;
    }
    .rail-btn {
      height: 60px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      cursor: pointer; color: var(--muted); user-select: none;
      border-left: 2px solid transparent;
      transition: background 0.1s, color 0.1s;
    }
    .rail-btn:hover { color: var(--fore-2); background: var(--panel-2); }
    .rail-btn.on {
      color: var(--accent); background: var(--panel-2);
      border-left-color: var(--accent);
    }
    .rail-btn .ico {
      font-size: 18px; line-height: 1;
      font-family: Consolas, monospace; font-weight: 600;
    }
    .rail-btn .lbl {
      font-size: 9.5px; letter-spacing: 0.6px; text-transform: uppercase;
    }
    .rail-btn .count {
      position: absolute; right: 4px; top: 6px;
      background: var(--edge-2); color: var(--fore-2);
      font-size: 9px; font-family: Consolas, monospace;
      padding: 1px 4px; border-radius: 2px;
    }
    .rail-btn { position: relative; }
    #rail .spacer { flex: 1; }

    /* ── Drawer ──────────────────────────────────────────────── */
    #drawer {
      position: absolute; left: 60px; top: 0; height: 100%;
      width: 320px; background: var(--panel-2);
      border-right: 1px solid var(--edge); z-index: 5;
      overflow: hidden;
      transform: translateX(-100%); transition: transform 0.18s ease;
      box-shadow: 4px 0 16px rgba(0,0,0,0.3);
      display: flex; flex-direction: column;
    }
    #drawer.open { transform: translateX(0); }
    .drawer-h {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; border-bottom: 1px solid var(--edge);
      flex-shrink: 0;
    }
    .drawer-h .title {
      font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--fore-2);
    }
    .drawer-h .count {
      color: var(--muted); font-size: 11px;
      font-family: Consolas, monospace;
    }
    .drawer-h .close {
      margin-left: auto; cursor: pointer; color: var(--muted);
      font-family: Consolas, monospace; font-size: 14px;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid transparent;
    }
    .drawer-h .close:hover { color: var(--fore); border-color: var(--edge-2); }

    .filter {
      padding: 8px 12px; border-bottom: 1px solid var(--edge);
      flex-shrink: 0;
    }
    .filter input {
      width: 100%; background: var(--bg); color: var(--fore);
      border: 1px solid var(--edge-2); padding: 5px 8px;
      font: 11.5px Consolas, monospace; outline: none;
    }
    .filter input:focus { border-color: var(--accent); }

    .drawer-body {
      flex: 1; overflow-y: auto;
      padding: 4px 0;
    }
    .drawer-body::-webkit-scrollbar { width: 10px; }
    .drawer-body::-webkit-scrollbar-thumb { background: var(--edge-2); }

    /* List entries (Links + Joints share styling) */
    .entry {
      border-left: 2px solid transparent;
      padding: 6px 12px;
      cursor: pointer;
      font-family: Consolas, monospace; font-size: 11.5px;
    }
    .entry:hover { background: var(--panel-3); }
    .entry.active {
      background: rgba(90, 168, 224, 0.10);
      border-left-color: var(--accent);
    }
    .entry .row1 {
      display: flex; align-items: center; gap: 6px;
    }
    .entry .name { color: var(--fore); }
    .entry .badge {
      font-size: 9.5px; padding: 0 5px; border-radius: 2px;
      letter-spacing: 0.4px; text-transform: uppercase;
    }
    .entry .badge.rev,
    .entry .badge.continuous {
      color: var(--y);
      background: rgba(110, 208, 132, 0.08);
      border: 1px solid rgba(110, 208, 132, 0.25);
    }
    .entry .badge.prismatic {
      color: var(--z);
      background: rgba(90, 164, 255, 0.08);
      border: 1px solid rgba(90, 164, 255, 0.25);
    }
    .entry .badge.fixed {
      color: var(--muted);
      background: rgba(108, 114, 128, 0.08);
      border: 1px solid var(--edge-2);
    }
    .entry .badge.floating,
    .entry .badge.planar {
      color: var(--warn);
      background: rgba(230, 162, 90, 0.08);
      border: 1px solid rgba(230, 162, 90, 0.25);
    }
    .entry .meta {
      color: var(--muted); font-size: 10.5px; margin-top: 2px;
    }
    .entry .detail {
      display: none;
      margin-top: 6px; padding: 7px 9px;
      background: var(--bg);
      border: 1px solid var(--edge);
      font-size: 10.5px; color: var(--fore-2);
    }
    .entry.active .detail { display: block; }
    .detail .kv {
      display: grid; grid-template-columns: 70px 1fr; gap: 2px 8px;
    }
    .detail .kv b { color: var(--fore); font-weight: normal; }
    .detail .slidewrap {
      margin-top: 7px; display: flex; gap: 6px; align-items: center;
    }
    .detail .slidewrap input[type=range] {
      flex: 1; accent-color: var(--accent);
    }
    .detail .slidewrap .val {
      color: var(--accent); font-family: Consolas, monospace;
      font-size: 10.5px; width: 60px; text-align: right;
    }
    .empty {
      padding: 20px 14px; color: var(--muted);
      font-size: 11.5px; text-align: center;
    }

    /* ── Viewport ────────────────────────────────────────────── */
    #stage {
      position: relative; min-width: 0;
      background: radial-gradient(ellipse at center, #1a1f28 0%, #0c0e12 80%);
      overflow: hidden;
    }
    canvas { display: block; }

    /* HUD overlays */
    .hud {
      position: absolute;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid var(--edge);
      padding: 6px 10px;
      font-family: Consolas, monospace; font-size: 11px;
      color: var(--fore-2);
      pointer-events: none;
    }
    .hud b { color: var(--accent); font-weight: normal; }
    .hud-tl { top: 14px; left: 14px; max-width: 360px; }
    .hud-tl .line { margin: 1px 0; }
    .hud-tr {
      top: 14px; right: 14px; color: var(--muted);
    }
    .hud-bl {
      bottom: 14px; left: 14px;
      display: flex; gap: 4px; padding: 4px 6px;
      pointer-events: auto;
    }
    .hud-bl .tg {
      background: transparent;
      border: 1px solid var(--edge-2);
      padding: 3px 7px; font-size: 10.5px;
      color: var(--muted); cursor: pointer;
      font-family: Consolas, monospace;
      transition: color 0.1s, border-color 0.1s, background 0.1s;
      user-select: none;
    }
    .hud-bl .tg:hover { color: var(--fore-2); }
    .hud-bl .tg.on {
      color: var(--accent); border-color: var(--accent);
      background: rgba(90, 168, 224, 0.06);
    }
    .hud-br {
      bottom: 14px; right: 14px; color: var(--muted); font-size: 10.5px;
    }

    /* Floating link-name labels */
    .link-label {
      position: absolute; transform: translate(-50%, -100%);
      pointer-events: none;
      font: 10.5px/1 Consolas, monospace; color: var(--accent);
      background: rgba(14, 17, 22, 0.7); padding: 1px 5px;
      border: 1px solid var(--edge);
      white-space: nowrap;
    }

    .err {
      position: fixed; top: 12px; right: 12px;
      max-width: 520px; z-index: 9999;
      background: #3a0e0e; border: 1px solid var(--bad);
      color: #ffcfcf; padding: 8px 12px;
      font: 11px/1.4 Consolas, monospace;
      white-space: pre-wrap; word-break: break-word;
    }
  </style>

  <!-- Offline-first importmap: every module resolves under ./vendor/.
       No network calls at runtime. Pinned versions match
       scripts/FetchPreviewVendor.ps1; bump both together. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/",
      "three/examples/jsm/": "./vendor/three/examples/jsm/",
      "urdf-loader": "./vendor/urdf-loader/src/URDFLoader.js"
    }
  }
  </script>
</head>

<!-- Surface any uncaught error directly on the page so the user doesn't
     need DevTools open to diagnose. -->
<script>
  (function () {
    function pin(msg) {
      var box = document.createElement('div');
      box.className = 'err';
      box.textContent = msg;
      (document.body || document.documentElement).appendChild(box);
    }
    window.addEventListener('error', function (e) {
      var src = e.filename ? (e.filename + ':' + e.lineno + ':' + e.colno) : '';
      pin('JS error: ' + (e.message || e.error) + (src ? '\n' + src : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      pin('Promise rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
    });
  })();
</script>

<div id="app">

  <!-- Icon rail -->
  <div id="rail">
    <div class="logo">SW2</div>
    <div class="rail-btn" id="btnLinks"  title="Links">
      <span class="ico">⊟</span>
      <span class="lbl">links</span>
      <span class="count" id="cntLinks">–</span>
    </div>
    <div class="rail-btn" id="btnJoints" title="Joints">
      <span class="ico">⤺</span>
      <span class="lbl">joints</span>
      <span class="count" id="cntJoints">–</span>
    </div>
    <div class="spacer"></div>
    <div class="rail-btn" id="btnFit"   title="Re-fit camera to model">
      <span class="ico">⛶</span>
      <span class="lbl">fit</span>
    </div>
  </div>

  <!-- Drawer -->
  <div id="drawer">
    <div class="drawer-h">
      <span class="title" id="drawerTitle">Links</span>

      <span class="close" onclick="closeDrawer()">✕</span>
    </div>
    <div class="filter">
      <input type="text" id="filterInput" placeholder="filter…" autocomplete="off"/>
    </div>
    <div class="drawer-body" id="linksList" data-pane="links"></div>
    <div class="drawer-body" id="jointsList" data-pane="joints" style="display:none"></div>
  </div>

  <!-- Stage -->
  <main id="stage">
    <div class="hud hud-tl">
      <div class="line" id="hudTitle">Loading…</div>
      <div class="line" id="hudCounts" style="color: var(--muted)"></div>
      <div class="line" id="hudSelected" style="color: var(--accent); display:none"></div>
    </div>
    <div class="hud hud-tr" id="hudCam">Z-up · REP-103</div>
    <div class="hud hud-bl">
      <span class="tg on"   id="tgVisual"    title="Show / hide DAE meshes">▣ visual</span>
      <span class="tg"      id="tgCollision" title="Show / hide STL collision hulls">▢ collision</span>
      <span class="tg on"   id="tgLinkAxes"  title="Show / hide per-link TF triads">⊕ frames</span>
      <span class="tg on"   id="tgJointAxes" title="Show / hide per-joint axis arrows">⤺ axes</span>
      <span class="tg"      id="tgInertial"  title="Show / hide inertial COM markers">● COM</span>
      <span class="tg on"   id="tgLabels"    title="Show / hide floating link-name labels">labels</span>
      <span class="tg on"   id="tgGrid"      title="Show / hide ground grid">grid</span>
      <span class="tg on"   id="tgLive"      title="Pause / resume live SW joint poll">⟳ live</span>
    </div>
    <div class="hud hud-br" id="hudStatus">init</div>
  </main>

</div>

<script type="module">
  import * as THREE        from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
  import { STLLoader }     from 'three/addons/loaders/STLLoader.js';
  import URDFLoader        from 'urdf-loader';

  // ── DOM ─────────────────────────────────────────────────────
  const stage         = document.getElementById('stage');
  const drawerEl      = document.getElementById('drawer');
  const drawerTitleEl = document.getElementById('drawerTitle');
  const drawerCountEl = document.getElementById('drawerCount');
  const filterInputEl = document.getElementById('filterInput');
  const linksListEl   = document.getElementById('linksList');
  const jointsListEl  = document.getElementById('jointsList');
  const btnLinks      = document.getElementById('btnLinks');
  const btnJoints     = document.getElementById('btnJoints');
  const btnFit        = document.getElementById('btnFit');
  const cntLinksEl    = document.getElementById('cntLinks');
  const cntJointsEl   = document.getElementById('cntJoints');
  const hudTitleEl    = document.getElementById('hudTitle');
  const hudCountsEl   = document.getElementById('hudCounts');
  const hudSelectedEl = document.getElementById('hudSelected');
  const hudCamEl      = document.getElementById('hudCam');
  const hudStatusEl   = document.getElementById('hudStatus');

  // HUD toggle nodes
  const tgVisual    = document.getElementById('tgVisual');
  const tgCollision = document.getElementById('tgCollision');
  const tgLinkAxes  = document.getElementById('tgLinkAxes');
  const tgJointAxes = document.getElementById('tgJointAxes');
  const tgInertial  = document.getElementById('tgInertial');
  const tgLabels    = document.getElementById('tgLabels');
  const tgGrid      = document.getElementById('tgGrid');
  const tgLive      = document.getElementById('tgLive');

  function setStatus(txt, isErr) {
    hudStatusEl.textContent = txt;
    hudStatusEl.style.color = isErr ? 'var(--bad)' : 'var(--muted)';
  }
  function showError(msg) {
    const div = document.createElement('div');
    div.className = 'err';
    div.textContent = msg;
    document.body.appendChild(div);
    setStatus(msg, true);
    console.error('[sw2gz-preview]', msg);
  }

  // ── Drawer open / close ─────────────────────────────────────
  let activePane = null; // 'links' | 'joints' | null
  function openDrawer(pane) {
    activePane = pane;
    drawerEl.classList.add('open');
    btnLinks.classList.toggle('on',  pane === 'links');
    btnJoints.classList.toggle('on', pane === 'joints');
    linksListEl.style.display  = pane === 'links'  ? 'block' : 'none';
    jointsListEl.style.display = pane === 'joints' ? 'block' : 'none';
    drawerTitleEl.textContent  = pane === 'links' ? 'Links' : 'Joints';
    const count = pane === 'links' ? cntLinksEl.textContent : cntJointsEl.textContent;
    drawerCountEl.textContent = count !== '–' ? '(' + count + ')' : '';
    filterInputEl.value = '';
    applyFilter('');
    filterInputEl.focus();
  }
  function closeDrawer() {
    activePane = null;
    drawerEl.classList.remove('open');
    btnLinks.classList.remove('on');
    btnJoints.classList.remove('on');
  }
  window.closeDrawer = closeDrawer;
  btnLinks.addEventListener('click', () => {
    activePane === 'links' ? closeDrawer() : openDrawer('links');
  });
  btnJoints.addEventListener('click', () => {
    activePane === 'joints' ? closeDrawer() : openDrawer('joints');
  });
  btnFit.addEventListener('click', () => fitCamera());

  filterInputEl.addEventListener('input', () => applyFilter(filterInputEl.value));
  function applyFilter(q) {
    const list = activePane === 'joints' ? jointsListEl : linksListEl;
    const needle = (q || '').trim().toLowerCase();
    list.querySelectorAll('.entry').forEach(el => {
      const name = el.dataset.name || '';
      el.style.display = (!needle || name.toLowerCase().includes(needle)) ? '' : 'none';
    });
  }

  // ── Scene + camera + lights ─────────────────────────────────
  const scene = new THREE.Scene();
  scene.background = null;

  const camera = new THREE.PerspectiveCamera(45, 1, 0.001, 100);
  camera.up.set(0, 0, 1);
  camera.position.set(0.6, -0.6, 0.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 0, 0.15);

  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  scene.add(new THREE.HemisphereLight(0xb8c4d0, 0x2a3040, 0.55));
  const keyL  = new THREE.DirectionalLight(0xffffff, 1.1);
  keyL.position.set(2, 3, 2.5); scene.add(keyL);
  const fillL = new THREE.DirectionalLight(0xc8d8ff, 0.55);
  fillL.position.set(-2, -1, 1); scene.add(fillL);
  const rimL  = new THREE.DirectionalLight(0xffffff, 0.45);
  rimL.position.set(0, -2, -1); scene.add(rimL);

  const grid = new THREE.GridHelper(4, 40, 0x444c5a, 0x232a36);
  grid.rotation.x = Math.PI / 2;
  grid.material.opacity = 0.45;
  grid.material.transparent = true;
  scene.add(grid);

  const worldAxes = new THREE.AxesHelper(0.4);
  scene.add(worldAxes);

  // Corner gizmo overlay
  const GIZMO_PX = 96;
  const gizmoScene = new THREE.Scene();
  const gizmoCam   = new THREE.OrthographicCamera(-1.2, 1.2, 1.2, -1.2, 0.1, 10);
  gizmoCam.position.set(0, 0, 3);
  gizmoCam.up.set(0, 0, 1);
  gizmoScene.add(new THREE.AxesHelper(1));

  // ── Per-load state ──────────────────────────────────────────
  let robot = null;
  let linkLabels = [];
  let perLinkAxes = [];
  let perJointAxes = [];
  let inertialMarkers = [];
  let linkMeta = {};
  let jointMeta = {};

  function resize() {
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  // ── URDF metadata parser ────────────────────────────────────
  function parseUrdfMeta(urdfText) {
    const doc = new DOMParser().parseFromString(urdfText, 'application/xml');
    const err = doc.querySelector('parsererror');
    if (err) { showError('URDF XML parse error: ' + err.textContent.slice(0, 200)); return; }

    const vec = (s) => (s || '').trim().split(/\s+/).map(Number);

    for (const link of doc.getElementsByTagName('link')) {
      const name = link.getAttribute('name'); if (!name) continue;
      const inertial = link.getElementsByTagName('inertial')[0];
      const meta = { mass: null, com: null, inertia: null, hasInertial: false };
      if (inertial) {
        meta.hasInertial = true;
        const mass = inertial.getElementsByTagName('mass')[0];
        if (mass) meta.mass = parseFloat(mass.getAttribute('value'));
        const origin = inertial.getElementsByTagName('origin')[0];
        if (origin) meta.com = vec(origin.getAttribute('xyz'));
        const inertia = inertial.getElementsByTagName('inertia')[0];
        if (inertia) {
          meta.inertia = {
            ixx: parseFloat(inertia.getAttribute('ixx') || 0),
            iyy: parseFloat(inertia.getAttribute('iyy') || 0),
            izz: parseFloat(inertia.getAttribute('izz') || 0),
            ixy: parseFloat(inertia.getAttribute('ixy') || 0),
            ixz: parseFloat(inertia.getAttribute('ixz') || 0),
            iyz: parseFloat(inertia.getAttribute('iyz') || 0),
          };
        }
      }
      linkMeta[name] = meta;
    }

    for (const joint of doc.getElementsByTagName('joint')) {
      const name = joint.getAttribute('name'); if (!name) continue;
      const type = joint.getAttribute('type') || 'fixed';
      const parent = joint.getElementsByTagName('parent')[0];
      const child  = joint.getElementsByTagName('child')[0];
      const origin = joint.getElementsByTagName('origin')[0];
      const axis   = joint.getElementsByTagName('axis')[0];
      const limit  = joint.getElementsByTagName('limit')[0];
      jointMeta[name] = {
        type,
        parent: parent?.getAttribute('link') || null,
        child:  child?.getAttribute('link')  || null,
        origin: {
          xyz: origin ? vec(origin.getAttribute('xyz') || '0 0 0') : [0,0,0],
          rpy: origin ? vec(origin.getAttribute('rpy') || '0 0 0') : [0,0,0],
        },
        axis: axis ? vec(axis.getAttribute('xyz') || '1 0 0') : [1,0,0],
        limit: limit ? {
          lower:    parseFloat(limit.getAttribute('lower') || 'NaN'),
          upper:    parseFloat(limit.getAttribute('upper') || 'NaN'),
          effort:   parseFloat(limit.getAttribute('effort') || 'NaN'),
          velocity: parseFloat(limit.getAttribute('velocity') || 'NaN'),
        } : null,
      };
    }
  }

  // ── URDF load ────────────────────────────────────────────────
  const loader = new URDFLoader();
  loader.packages = { '': '' };

  // Override SW-exported DAE materials with a neutral standard material so
  // geometry stays legible regardless of original diffuse color.
  const overrideMat = new THREE.MeshStandardMaterial({
    color: 0xc8cdd5, roughness: 0.55, metalness: 0.05,
  });
  function paintMeshes(obj) {
    obj.traverse(o => {
      if (o.isMesh) {
        o.material = overrideMat;
        if (o.geometry && !o.geometry.attributes.normal) o.geometry.computeVertexNormals();
      }
    });
  }

  loader.loadMeshCb = (path, manager, onLoad) => {
    const lower = path.toLowerCase();
    if (lower.endsWith('.dae')) {
      new ColladaLoader(manager).load(path,
        dae => { paintMeshes(dae.scene); onLoad(dae.scene); },
        undefined,
        err => { console.warn('DAE load fail', path, err); onLoad(new THREE.Object3D()); });
    } else if (lower.endsWith('.stl')) {
      new STLLoader(manager).load(path,
        geom => {
          geom.computeVertexNormals();
          const mat = new THREE.MeshStandardMaterial({
            color: 0x54ff7a, roughness: 0.6, metalness: 0.0,
            transparent: true, opacity: 0.32, depthWrite: false,
          });
          onLoad(new THREE.Mesh(geom, mat));
        },
        undefined,
        err => { console.warn('STL load fail', path, err); onLoad(new THREE.Object3D()); });
    } else {
      console.warn('Unknown mesh format:', path);
      onLoad(new THREE.Object3D());
    }
  };

  async function loadUrdf() {
    setStatus('Fetching URDF…');
    let urdfText;
    try {
      const r = await fetch('/robot.urdf');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      urdfText = await r.text();
    } catch (e) {
      showError('Could not load /robot.urdf: ' + e.message);
      return;
    }

    urdfText = urdfText.replace(/<xacro:[^>]*\/>/g, '')
                       .replace(/<xacro:[^>]*>[\s\S]*?<\/xacro:[^>]*>/g, '');

    parseUrdfMeta(urdfText);

    const m = urdfText.match(/<robot[^>]*\sname="([^"]+)"/);
    const pkg = m ? m[1] : '';
    loader.packages = { [pkg]: '' };

    setStatus('Building scene…');
    try {
      robot = loader.parse(urdfText);
    } catch (e) {
      showError('URDF parse failed: ' + e.message);
      return;
    }
    scene.add(robot);

    decorateLinks();
    decorateJoints();
    buildLinksPane();
    buildJointsPane();
    applyToggles();
    fitCamera();

    // Re-fit a few times while async mesh loads settle.
    setTimeout(fitCamera, 250);
    setTimeout(fitCamera, 800);
    setTimeout(fitCamera, 2000);

    const nL = Object.keys(robot.links || {}).length;
    const nJ = Object.keys(robot.joints || {}).length;
    cntLinksEl.textContent  = String(nL);
    cntJointsEl.textContent = String(nJ);
    hudTitleEl.innerHTML    = '<b>' + (pkg || 'robot') + '</b>';
    hudCountsEl.textContent = nL + ' link(s) · ' + nJ + ' joint(s)';
    setStatus('ready');

    // Default: links drawer open so the user sees the structure right away.
    openDrawer('links');
  }

  function decorateLinks() {
    for (const name of Object.keys(robot.links)) {
      const link = robot.links[name];

      const axes = new THREE.AxesHelper(0.10);
      link.add(axes);
      perLinkAxes.push(axes);

      const el = document.createElement('div');
      el.className = 'link-label';
      el.textContent = name;
      stage.appendChild(el);
      linkLabels.push({ link, el });

      const meta = linkMeta[name];
      if (meta && meta.hasInertial && meta.com) {
        const mass = meta.mass ?? 0.1;
        const r = Math.min(0.05, Math.max(0.01, Math.cbrt(mass) * 0.025));
        const mat = new THREE.MeshStandardMaterial({
          color: 0xf0a352, emissive: 0x3a1f00, roughness: 0.4, metalness: 0.0,
        });
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
        sphere.position.set(meta.com[0], meta.com[1], meta.com[2]);
        link.add(sphere);
        inertialMarkers.push(sphere);
      }
    }
  }

  function decorateJoints() {
    for (const [name, joint] of Object.entries(robot.joints)) {
      const meta = jointMeta[name];
      const type = meta?.type || joint.jointType;
      if (type === 'fixed') continue;
      const axis = meta?.axis ?? [
        joint.axis?.x ?? 1, joint.axis?.y ?? 0, joint.axis?.z ?? 0,
      ];
      const dir = new THREE.Vector3(axis[0], axis[1], axis[2]);
      if (dir.lengthSq() < 1e-9) continue;
      dir.normalize();
      const color =
        type === 'revolute' || type === 'continuous' ? 0x54ff7a :
        type === 'prismatic' ? 0x54a4ff :
        type === 'planar' || type === 'floating' ? 0xf0a352 :
        0xcccccc;
      const arrow = new THREE.ArrowHelper(dir, new THREE.Vector3(0,0,0), 0.18, color, 0.06, 0.035);
      joint.add(arrow);
      perJointAxes.push(arrow);
    }
  }

  // ── Drawer panes: Links + Joints ───────────────────────────
  const f = (v, d = 4) =>
    (typeof v === 'number' && isFinite(v)) ? v.toFixed(d) : '—';
  const fv = (a, d = 4) =>
    Array.isArray(a) ? a.map(x => f(x, d)).join(', ') : '—';
  const fdeg = (rad) =>
    isFinite(rad) ? (rad * 180 / Math.PI).toFixed(1) + '°' : '—';

  function buildLinksPane() {
    linksListEl.innerHTML = '';
    if (!robot) return;
    for (const name of Object.keys(robot.links)) {
      const meta = linkMeta[name] || {};
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.dataset.name = name;
      entry.innerHTML = `
        <div class="row1">
          <span class="name">${name}</span>
        </div>
        <div class="meta">${meta.hasInertial ? `${f(meta.mass, 3)} kg` : 'no inertial'}</div>
        <div class="detail">
          <div class="kv">
            <span>mass</span><b>${f(meta.mass, 6)} kg</b>
            <span>com</span><b>${fv(meta.com)}</b>
            <span>ixx</span><b>${f(meta.inertia?.ixx, 6)}</b>
            <span>iyy</span><b>${f(meta.inertia?.iyy, 6)}</b>
            <span>izz</span><b>${f(meta.inertia?.izz, 6)}</b>
            <span>ixy</span><b>${f(meta.inertia?.ixy, 6)}</b>
            <span>ixz</span><b>${f(meta.inertia?.ixz, 6)}</b>
            <span>iyz</span><b>${f(meta.inertia?.iyz, 6)}</b>
          </div>
        </div>`;
      entry.addEventListener('click', () => selectEntry(entry, 'link', name));
      linksListEl.appendChild(entry);
    }
  }

  function buildJointsPane() {
    jointsListEl.innerHTML = '';
    if (!robot) return;
    const moveTypes = new Set(['revolute', 'continuous', 'prismatic']);
    for (const [name, joint] of Object.entries(robot.joints)) {
      const meta = jointMeta[name] || {};
      const type = meta.type || joint.jointType || 'fixed';

      let slider = '';
      if (moveTypes.has(type)) {
        const isCont = type === 'continuous';
        const lo = meta.limit?.lower, up = meta.limit?.upper;
        const zeroRange = lo === 0 && up === 0;
        const lower = (isCont || zeroRange || !isFinite(lo)) ? -Math.PI : lo;
        const upper = (isCont || zeroRange || !isFinite(up)) ?  Math.PI : up;
        const isAng = type !== 'prismatic';
        slider = `
          <div class="slidewrap">
            <input type="range" min="${lower}" max="${upper}" step="0.001" value="0" data-joint="${name}"/>
            <span class="val">0.000 ${isAng ? 'rad' : 'm'}</span>
          </div>`;
      }

      const lim = meta.limit || {};
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.dataset.name = name;
      entry.innerHTML = `
        <div class="row1">
          <span class="name">${name}</span>
          <span class="badge ${type}">${type}</span>
        </div>
        <div class="meta">${meta.parent || '?'} → ${meta.child || '?'}</div>
        <div class="detail">
          <div class="kv">
            <span>parent</span><b>${meta.parent || '—'}</b>
            <span>child</span><b>${meta.child || '—'}</b>
            <span>xyz</span><b>${fv(meta.origin?.xyz)}</b>
            <span>rpy</span><b>${fv(meta.origin?.rpy)}</b>
            <span>axis</span><b>${fv(meta.axis, 4)}</b>
            <span>lower</span><b>${f(lim.lower)} (${fdeg(lim.lower)})</b>
            <span>upper</span><b>${f(lim.upper)} (${fdeg(lim.upper)})</b>
            <span>effort</span><b>${f(lim.effort, 2)}</b>
            <span>vel</span><b>${f(lim.velocity, 2)}</b>
          </div>
          ${slider}
        </div>`;
      entry.addEventListener('click', (ev) => {
        if (ev.target.tagName === 'INPUT') return;
        selectEntry(entry, 'joint', name);
      });
      jointsListEl.appendChild(entry);

      const input = entry.querySelector('input[type=range]');
      if (input) {
        const valEl = entry.querySelector('.val');
        const isAng = type !== 'prismatic';
        input.addEventListener('input', () => {
          input.dataset.userTouched = '1';
          const v = parseFloat(input.value);
          robot.setJointValue(name, v);
          valEl.textContent = v.toFixed(3) + (isAng ? ' rad' : ' m');
        });
        input.addEventListener('change', () => {
          setTimeout(() => { input.dataset.userTouched = ''; }, 800);
        });
      }
    }
  }

  function selectEntry(entry, kind, name) {
    const wasActive = entry.classList.contains('active');
    entry.parentElement.querySelectorAll('.entry.active').forEach(e => e.classList.remove('active'));
    if (!wasActive) {
      entry.classList.add('active');
      flashFocus(kind, name);
      hudSelectedEl.style.display = 'block';
      hudSelectedEl.textContent = 'sel: ' + name;
    } else {
      hudSelectedEl.style.display = 'none';
    }
  }

  function flashFocus(kind, name) {
    if (!robot) return;
    let obj = null;
    if (kind === 'link') obj = robot.links[name];
    else if (kind === 'joint') {
      const j = robot.joints[name];
      obj = j?.child ? robot.links[j.child] : j;
    }
    if (!obj) return;
    const pos = new THREE.Vector3();
    obj.getWorldPosition(pos);
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0x5aa8e0, transparent: true, opacity: 0.55 })
    );
    sphere.position.copy(pos);
    scene.add(sphere);
    const start = performance.now();
    const animate = () => {
      const t = (performance.now() - start) / 700;
      if (t >= 1) { scene.remove(sphere); sphere.geometry.dispose(); sphere.material.dispose(); return; }
      sphere.scale.setScalar(1 + t * 2.2);
      sphere.material.opacity = 0.55 * (1 - t);
      requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);
  }

  // ── HUD toggles ─────────────────────────────────────────────
  function applyToggles() {
    const visualOn    = tgVisual.classList.contains('on');
    const collisionOn = tgCollision.classList.contains('on');
    const linkAxesOn  = tgLinkAxes.classList.contains('on');
    const jointAxesOn = tgJointAxes.classList.contains('on');
    const inertialOn  = tgInertial.classList.contains('on');
    const labelsOn    = tgLabels.classList.contains('on');
    const gridOn      = tgGrid.classList.contains('on');

    if (robot) {
      robot.traverse(o => {
        if (o.isURDFVisual)   o.visible = visualOn;
        if (o.isURDFCollider) o.visible = collisionOn;
      });
    }
    perLinkAxes.forEach(a => a.visible = linkAxesOn);
    perJointAxes.forEach(a => a.visible = jointAxesOn);
    inertialMarkers.forEach(m => m.visible = inertialOn);
    linkLabels.forEach(({el}) => el.style.display = labelsOn ? '' : 'none');
    grid.visible = gridOn;
  }
  [tgVisual, tgCollision, tgLinkAxes, tgJointAxes, tgInertial, tgLabels, tgGrid].forEach(tg => {
    tg.addEventListener('click', () => { tg.classList.toggle('on'); applyToggles(); });
  });
  tgLive.addEventListener('click', () => { tgLive.classList.toggle('on'); });

  function fitCamera() {
    if (!robot) return;
    const box = new THREE.Box3();
    let any = false;
    robot.traverse(o => {
      if (o.isMesh && o.geometry) { box.expandByObject(o); any = true; }
    });
    if (!any || !isFinite(box.min.x)) return;
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const r = Math.max(size.length() * 0.9, 0.4);
    controls.target.copy(center);
    camera.position.set(center.x + r, center.y - r * 1.1, center.z + r * 0.55);
    camera.near = Math.max(r * 0.0005, 0.001);
    camera.far  = Math.max(r * 1000, 50);
    camera.updateProjectionMatrix();
    controls.update();
  }

  // ── Live joint poll ────────────────────────────────────────
  async function pollJoints() {
    if (!robot || !tgLive.classList.contains('on')) return;
    try {
      const r = await fetch('/joint_states');
      if (!r.ok) return;
      const states = await r.json();
      for (const [name, value] of Object.entries(states)) {
        if (!robot.joints[name]) continue;
        robot.setJointValue(name, value);
        const input = jointsListEl.querySelector(`input[data-joint="${CSS.escape(name)}"]`);
        if (input && !input.dataset.userTouched) {
          input.value = value;
          const valEl = input.parentElement.querySelector('.val');
          const isAng = jointMeta[name]?.type !== 'prismatic';
          if (valEl) valEl.textContent = value.toFixed(3) + (isAng ? ' rad' : ' m');
        }
      }
    } catch (e) { /* swallow */ }
  }
  setInterval(pollJoints, 100);

  // ── Render loop ────────────────────────────────────────────
  const tmp = new THREE.Vector3();
  function tick() {
    requestAnimationFrame(tick);
    controls.update();
    renderer.render(scene, camera);

    // Corner gizmo overlay
    const cw = renderer.domElement.width;
    const ch = renderer.domElement.height;
    const dpr = renderer.getPixelRatio();
    const px = GIZMO_PX * dpr;
    gizmoCam.position.copy(camera.position).sub(controls.target).normalize().multiplyScalar(3);
    gizmoCam.up.copy(camera.up);
    gizmoCam.lookAt(0, 0, 0);
    const prevAutoClear = renderer.autoClear;
    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.setScissorTest(true);
    renderer.setScissor(cw - px - 6 * dpr, ch - px - 6 * dpr, px, px);
    renderer.setViewport(cw - px - 6 * dpr, ch - px - 6 * dpr, px, px);
    renderer.render(gizmoScene, gizmoCam);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, cw, ch);
    renderer.autoClear = prevAutoClear;

    // Floating link labels
    if (tgLabels.classList.contains('on')) {
      for (const { link, el } of linkLabels) {
        link.getWorldPosition(tmp);
        tmp.project(camera);
        const x = (tmp.x * 0.5 + 0.5) * stage.clientWidth;
        const y = (1 - (tmp.y * 0.5 + 0.5)) * stage.clientHeight;
        const inFront = tmp.z < 1;
        el.style.transform = `translate(${x}px, ${y - 12}px) translate(-50%, -100%)`;
        el.style.opacity = inFront ? '0.9' : '0';
      }
    }
  }
  tick();
  loadUrdf();
</script>
</body>
</html>
