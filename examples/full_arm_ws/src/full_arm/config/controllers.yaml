controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - link1_1_link1_2_joint
      - link1_2_link1_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
